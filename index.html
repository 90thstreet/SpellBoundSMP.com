<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpellBoundSMP</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      color: white;
      background: linear-gradient(135deg, #7b2ff7, #00c6ff);
    }

    /* Particles canvas */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 60px 20px;
    }

    /* Logo glow */
    .logo {
      font-size: 2.2rem;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 10px;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 14px;
      background: rgba(0,0,0,0.25);
      box-shadow: 0 0 15px rgba(0,198,255,0.6), 0 0 25px rgba(123,47,247,0.6);
      animation: glow 2.5s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 10px rgba(0,198,255,0.4), 0 0 20px rgba(123,47,247,0.4);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 25px rgba(0,198,255,0.9), 0 0 40px rgba(123,47,247,0.9);
        transform: scale(1.05);
      }
    }

    h1 {
      font-size: 3.2rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    a.button {
      display: inline-block;
      padding: 12px 25px;
      background: white;
      color: #7b2ff7;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.3s;
    }

    a.button:hover {
      background: #00c6ff;
      color: white;
      transform: scale(1.05);
    }

    .section {
      margin-top: 60px;
    }

    .staff {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .card {
      background: rgba(0,0,0,0.35);
      padding: 20px;
      border-radius: 16px;
      width: 200px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .role {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">

  <div class="logo">✦ SpellBoundSMP ✦</div>

  <h1>SpellBoundSMP</h1>
  <p>Join the magical world of SpellBoundSMP. Adventures, survival, and community await.</p>
  <a class="button" href="https://discord.gg/nBRe5zN45H" target="_blank">Join Our Discord</a>

  <div class="section">
    <h2>Staff Team</h2>
    <div class="staff">
      <div class="card">
        <h3>Jyoti</h3>
        <div class="role">Founder</div>
      </div>
      <div class="card">
        <h3>Rvnlo</h3>
        <div class="role">Founder</div>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function createParticles(count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 3 + 1,
      dx: (Math.random() - 0.5) * 0.5,
      dy: (Math.random() - 0.5) * 0.5
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(255,255,255,0.7)";

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
  });

  requestAnimationFrame(draw);
}

createParticles(120);
draw();
</script>

</body>
</html>
