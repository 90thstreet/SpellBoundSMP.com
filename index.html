<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpellBound SMP</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      color: white;
      background: radial-gradient(circle at top, #7b2ff7, #00c6ff);
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 60px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .logo {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 6px;
      display: inline-block;
      padding: 12px 26px;
      border-radius: 16px;
      background: rgba(0,0,0,0.25);
      box-shadow: 0 0 25px rgba(123,47,247,0.6), 0 0 35px rgba(0,198,255,0.5);
      animation: glow 2.8s ease-in-out infinite;
      margin-bottom: 10px;
    }

    @keyframes glow {
      0%,100% { transform: scale(1); box-shadow: 0 0 18px rgba(123,47,247,0.4), 0 0 22px rgba(0,198,255,0.4);} 
      50% { transform: scale(1.06); box-shadow: 0 0 35px rgba(123,47,247,0.9), 0 0 50px rgba(0,198,255,0.8);} 
    }

    h1 { font-size: 3rem; margin: 10px 0; }

    p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; margin: auto; }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 26px;
      border-radius: 12px;
      background: white;
      color: #7b2ff7;
      font-weight: 700;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.05);
      background: #00c6ff;
      color: white;
    }

    .section { margin-top: 70px; }

    .video { margin-top: 25px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.4);} 
    iframe { width: 100%; height: 360px; border: none; }

    .staff {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: rgba(0,0,0,0.35);
      padding: 20px;
      border-radius: 16px;
      width: 220px;
      backdrop-filter: blur(12px);
      transition: 0.3s;
    }

    .card:hover { transform: translateY(-6px); }

    .role { opacity: 0.8; margin-top: 5px; font-size: 0.9rem; }

    /* MUSIC BUTTON */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 5;
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      background: rgba(0,0,0,0.4);
      color: white;
      backdrop-filter: blur(10px);
      transition: 0.3s;
    }

    .music-btn:hover {
      transform: scale(1.05);
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <!-- Replace with your own ambience file if needed -->
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_0b3c1c7b7a.mp3?filename=ambient-minecraft-style-ambient-121936.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="toggleMusic()">🎵 Music: OFF</button>

<div class="container">

  <div class="logo">✦ SpellBound SMP ✦</div>

  <h1>Welcome to SpellBound SMP</h1>
  <p>A magical Minecraft survival experience where adventure, community, and mystery come together.</p>

  <a class="button" href="https://discord.gg/nBRe5zN45H" target="_blank">Join Our Discord</a>

  <div class="section">
    <h2>Promo Video</h2>
    <div class="video">
      <iframe src="https://www.youtube.com/embed/9drXl4Mcp9M" allowfullscreen></iframe>
    </div>
  </div>

  <div class="section">
    <h2>Staff Team</h2>
    <div class="staff">
      <div class="card">
        <h3>Jyoti</h3>
        <div class="role">Founder</div>
      </div>
      <div class="card">
        <h3>Rvnlo</h3>
        <div class="role">Founder</div>
      </div>
    </div>
  </div>

</div>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function init(){
  for(let i=0;i<130;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*2.5+1,
      dx:(Math.random()-0.5)*0.6,
      dy:(Math.random()-0.5)*0.6
    });
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="rgba(255,255,255,0.7)";

  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();

    p.x+=p.dx;
    p.y+=p.dy;

    if(p.x<0||p.x>canvas.width)p.dx*=-1;
    if(p.y<0||p.y>canvas.height)p.dy*=-1;
  });

  requestAnimationFrame(animate);
}

init();
animate();

// MUSIC TOGGLE
let musicOn = false;
const music = document.getElementById("bgMusic");

function toggleMusic(){
  if(!musicOn){
    music.play();
    musicOn = true;
    document.querySelector('.music-btn').innerText = "🎵 Music: ON";
  } else {
    music.pause();
    musicOn = false;
    document.querySelector('.music-btn').innerText = "🎵 Music: OFF";
  }
}
</script>

</body>
</html>
