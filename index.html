<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpellBound SMP</title>

  <!-- Minecraft-style font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      color: white;
      background: radial-gradient(circle at top, #7b2ff7, #00c6ff);
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 60px 20px;
      max-width: 1100px;
      margin: auto;
    }

    /* LOGO (Minecraft style) */
    .logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.4rem;
      letter-spacing: 3px;
      display: inline-block;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(0,0,0,0.35);
      box-shadow: 0 0 25px rgba(123,47,247,0.6), 0 0 35px rgba(0,198,255,0.5);
      animation: glow 2.8s ease-in-out infinite;
      margin-bottom: 10px;
    }

    @keyframes glow {
      0%,100% { transform: scale(1); box-shadow: 0 0 18px rgba(123,47,247,0.4), 0 0 22px rgba(0,198,255,0.4);} 
      50% { transform: scale(1.06); box-shadow: 0 0 35px rgba(123,47,247,0.9), 0 0 50px rgba(0,198,255,0.8);} 
    }

    h1 { font-size: 3rem; margin: 10px 0; }

    p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; margin: auto; }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 26px;
      border-radius: 12px;
      background: white;
      color: #7b2ff7;
      font-weight: 700;
      text-decoration: none;
      transition: 0.2s;
      cursor: pointer;
    }

    .button:hover {
      transform: scale(1.05);
      background: #00c6ff;
      color: white;
    }

    .section { margin-top: 70px; opacity: 0; transform: translateY(30px); transition: 0.8s ease; }
    .section.show { opacity: 1; transform: translateY(0); }

    .video { margin-top: 25px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.4);} 
    iframe { width: 100%; height: 360px; border: none; }

    .staff {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: rgba(0,0,0,0.35);
      padding: 20px;
      border-radius: 16px;
      width: 220px;
      backdrop-filter: blur(12px);
      transition: 0.3s;
    }

    .card:hover { transform: translateY(-6px); }

    .role { opacity: 0.8; margin-top: 5px; font-size: 0.9rem; }

    /* MUSIC PANEL */
    .music-panel{
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0,0,0,0.35);
      padding: 10px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
    }

    input[type="range"]{ width: 120px; }
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/16/audio_0b3c1c7b7a.mp3" type="audio/mpeg">
</audio>

<div class="music-panel">
  <button class="button" onclick="toggleMusic(); clickSound()">🎵 Music</button>
  <input id="volSlider" type="range" min="0" max="1" step="0.01" value="0.4" />
</div>

<div class="container">

  <div class="logo">SpellBound SMP</div>

  <h1>Welcome to SpellBound SMP</h1>
  <p>A magical Minecraft survival experience where adventure, community, and mystery come together.</p>

  <a class="button" href="https://discord.gg/nBRe5zN45H" target="_blank" onclick="clickSound()">Join Our Discord</a>

  <div class="section">
    <h2>Promo Video</h2>
    <div class="video">
      <iframe src="https://www.youtube.com/embed/9drXl4Mcp9M" allowfullscreen></iframe>
    </div>
  </div>

  <div class="section">
    <h2>Staff Team</h2>
    <div class="staff">
      <div class="card">
        <h3>Jyoti</h3>
        <div class="role">Founder</div>
      </div>
      <div class="card">
        <h3>Rvnlo</h3>
        <div class="role">Founder</div>
      </div>
    </div>
  </div>

</div>

<script>
/* PARTICLES */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let particles = [];

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function init(){
  for(let i=0;i<130;i++){
    particles.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*2.5+1,
      dx:(Math.random()-0.5)*0.6,
      dy:(Math.random()-0.5)*0.6
    });
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="rgba(255,255,255,0.7)";

  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();

    p.x+=p.dx;
    p.y+=p.dy;

    if(p.x<0||p.x>canvas.width)p.dx*=-1;
    if(p.y<0||p.y>canvas.height)p.dy*=-1;
  });

  requestAnimationFrame(animate);
}

init();
animate();

/* MUSIC */
const music=document.getElementById("bgMusic");
const slider=document.getElementById("volSlider");
let playing=false;

music.volume=slider.value;

function toggleMusic(){
  if(!playing){
    music.play();
    playing=true;
  } else {
    music.pause();
    playing=false;
  }
}

slider.addEventListener("input",()=>{
  music.volume=slider.value;
});

/* SCROLL ANIMATION */
const sections=document.querySelectorAll(".section");
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add("show"); }
  });
},{threshold:0.2});
sections.forEach(s=>observer.observe(s));

/* UI CLICK SOUND */
function clickSound(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "triangle";
  osc.frequency.value = 600;
  gain.gain.value = 0.05;

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime + 0.08);
}
</script>

</body>
</html>
